name: Build pmOS for courbet (courbet_stable fork)

# The working pmOS path for courbet is documented on the pmOS wiki as an
# out-of-tree fork: kevinwidjaja21/pmaports, branch courbet_stable, release
# channel v24.12. The device is not in the pmbootstrap repositories yet, so it
# cannot be selected through pmbootstrap init normally.
#
# gitlab.postmarketos.org sits behind Anubis, an anti-bot gate that needs
# JavaScript. A CI runner gets the challenge page instead of a tarball, so the
# clone cannot happen here. The branch tarball is therefore downloaded in a real
# browser and published as an asset on a release in this repository; this
# workflow takes that asset URL as an input and verifies it really is a gzip
# stream before using it.
#
# Browser URL that works:
#   https://gitlab.postmarketos.org/kevinwidjaja21/pmaports/-/archive/courbet_stable/pmaports-courbet_stable.tar.gz

on:
  workflow_dispatch:
    inputs:
      pmaports_tarball:
        description: 'Asset URL of the courbet_stable pmaports tarball'
        required: true
      channel:
        description: 'pmOS release channel (wiki: v24.12)'
        required: false
        default: 'v24.12'
      kernel_pkg:
        description: 'kernel package to build'
        required: false
        default: 'linux-postmarketos-qcom-sm7150'
      device:
        description: 'pmOS device codename'
        required: false
        default: 'xiaomi-courbet'
      cmdline:
        description: 'kernel cmdline (deviceinfo says console=null, so blank by default)'
        required: false
        default: ''

env:
  BUILD_DIR: /home/pmuser/pmbuild

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Install host dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates file cpio patch binutils \
            python3 python3-venv python3-pip \
            build-essential bc bison flex gawk libssl-dev libncurses-dev \
            util-linux squashfs-tools lz4 zstd xz-utils \
            gcc-aarch64-linux-gnu
          mkdir -p out

      - name: Install pmbootstrap
        run: |
          set -e
          sudo python3 -m venv /opt/pmbootstrap
          if ! sudo /opt/pmbootstrap/bin/pip install --no-cache-dir pmbootstrap; then
            echo "latest pmbootstrap refused, falling back to pinned 2.1.0"
            sudo /opt/pmbootstrap/bin/pip install --no-cache-dir "pmbootstrap==2.1.0"
          fi
          sudo ln -sf /opt/pmbootstrap/bin/pmbootstrap /usr/local/bin/pmbootstrap
          /opt/pmbootstrap/bin/python -c "import pmb; print('pmb imports OK')"

      - name: Create build user
        run: |
          set -e
          sudo adduser --disabled-password --gecos "" pmuser
          echo "pmuser ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/pmuser
          sudo install -d -o pmuser -g pmuser -m 0755 "$BUILD_DIR"

      - name: Fetch pmaports tarball
        env:
          ASSET_URL: ${{ github.event.inputs.pmaports_tarball }}
        run: |
          set -e
          # The release asset lives in this repository, which may be private,
          # and a release asset URL needs the token to be readable in that case.
          curl -Lf -H "Authorization: Bearer $GITHUB_TOKEN" \
               -o /tmp/pmaports.tar.gz "$ASSET_URL"
          if [ "$(od -An -tx1 -N2 /tmp/pmaports.tar.gz | tr -d ' ')" != "1f8b" ]; then
            echo "::error::that URL did not return a gzip tarball."
            echo "Most likely the Anubis challenge page came back instead."
            head -c 300 /tmp/pmaports.tar.gz || true
            exit 1
          fi
          sudo -u pmuser -H tar -xzf /tmp/pmaports.tar.gz -C "$BUILD_DIR"
          sudo -u pmuser -H bash -c "mv '$BUILD_DIR'/pmaports-* '$BUILD_DIR/pmaports'"

          # The port lives in device/testing, not device/community. Searching
          # only community finds nothing and the build then dies with a device
          # that pmbootstrap says does not exist.
          echo "--- courbet port ---"
          ls -d "$BUILD_DIR"/pmaports/device/*/device-xiaomi-courbet
          echo "--- kernel aport ---"
          ls -d "$BUILD_DIR"/pmaports/device/*/linux-postmarketos-qcom-sm7150
          echo "--- deviceinfo ---"
          grep -E 'deviceinfo_(dtb|flash_method|kernel_cmdline|header_version|flash_offset|flash_pagesize|rootfs_image_sector_size|append_dtb)' \
            "$BUILD_DIR"/pmaports/device/*/device-xiaomi-courbet/deviceinfo

      - name: Write pmbootstrap config
        run: |
          set -e
          sudo mkdir -p /home/pmuser/.config
          sudo tee /home/pmuser/.config/pmbootstrap.cfg > /dev/null <<EOF
          [pmbootstrap]
          aports = $BUILD_DIR/pmaports
          device = ${{ github.event.inputs.device }}
          kernel = mainline
          work = $BUILD_DIR/work
          EOF
          sudo chown pmuser:pmuser /home/pmuser/.config/pmbootstrap.cfg
          sudo chmod 600 /home/pmuser/.config/pmbootstrap.cfg

      - name: pmbootstrap init
        run: |
          set -o pipefail
          yes '' | sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' init" 2>&1 | tee out/init.log
          test "${PIPESTATUS[1]}" -eq 0

      - name: Set release channel
        run: |
          set -o pipefail
          sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' config channel '${{ github.event.inputs.channel }}'" \
            2>&1 | tee out/channel.log
          echo "--- effective config ---"
          sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' config" 2>&1 | tee -a out/channel.log

      - name: Build kernel package
        run: |
          set -o pipefail
          sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' build '${{ github.event.inputs.kernel_pkg }}' --force" \
            2>&1 | tee out/kernel.log
          test "${PIPESTATUS[1]}" -eq 0

      - name: Install into chroot
        run: |
          set -o pipefail
          yes '' | sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' install --no-fde" 2>&1 | tee out/install.log
          test "${PIPESTATUS[1]}" -eq 0

      - name: Collect kernel, initramfs, dtb
        run: |
          set -e
          ROOT="$(sudo find "$BUILD_DIR/work" -maxdepth 1 -name 'chroot_rootfs_*' | head -1)"
          echo "chroot: $ROOT"
          sudo ls -la "$ROOT/boot"
          sudo cp "$ROOT"/boot/vmlinuz* out/vmlinuz
          sudo cp "$ROOT"/boot/initramfs* out/initramfs
          DTB="$(sudo find "$ROOT/boot" -name '*courbet*.dtb' | head -1 || true)"
          if [ -z "$DTB" ]; then
            echo "::error::no courbet dtb under $ROOT/boot; what is there:"
            sudo find "$ROOT/boot" -name '*.dtb' | head -20 || true
            exit 1
          fi
          echo "dtb: $DTB"
          sudo cp "$DTB" out/courbet.dtb
          sudo chown runner:runner out/*
          ls -la out

      - name: Package fastboot-bootable image
        run: |
          set -e
          python3 - <<'PY'
          import struct
          k = open("out/vmlinuz", "rb").read()
          r = open("out/initramfs", "rb").read()
          t = open("out/courbet.dtb", "rb").read()
          page = 4096
          n = lambda s: (s + page - 1) // page
          h = bytearray(page)
          h[0:8] = b"ANDROID!"
          # Offsets copied from device-xiaomi-courbet/deviceinfo: base 0,
          # kernel 0x8000, ramdisk 0x1000000, tags 0x100, page 4096.
          struct.pack_into("<10I", h, 8,
                           len(k), 0x8000, len(r), 0x1000000, 0, 0, 0x100, page, 0, 0)
          cmd = "${{ github.event.inputs.cmdline }}".encode()
          assert len(cmd) < 512
          h[64:64 + len(cmd)] = cmd
          # deviceinfo_append_dtb="true": the tree goes after the ramdisk,
          # with its length recorded at offset 1648.
          img = bytearray(bytes(h) + k + b"\0" * (n(len(k)) * page - len(k)))
          img += r + b"\0" * (n(len(r)) * page - len(r)) + t
          struct.pack_into("<I", img, 1648, len(t))
          open("out/boot-pmos-courbet.img", "wb").write(img)
          print("kernel %d  ramdisk %d  dtb %d  image %d" % (len(k), len(r), len(t), len(img)))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-courbet-stable
          path: out/
          if-no-files-found: error
          retention-days: 30