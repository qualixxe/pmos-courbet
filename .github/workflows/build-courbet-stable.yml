name: Build pmOS for courbet (courbet_stable fork)

# The working pmOS path for courbet is an out-of-tree fork documented on the
# pmOS wiki: kevinwidjaja21/pmaports, branch courbet_stable, channel v24.12.
#
# An earlier version of this workflow fetched pmaports as a tarball because
# gitlab.postmarketos.org was thought to be unreachable. That was wrong. Anubis
# gates the web pages; the git endpoints answer normally, so both repositories
# are cloned directly and the tarball, the release asset and the "make the
# tarball into a git repository" workaround are all gone.
#
# Details that are not obvious:
#
#  - pmbootstrap's newest release on PyPI is 2.1.0, and this fork's
#    pmaports.cfg sets pmbootstrap_min_version=2.3.2. read_config() refuses to
#    continue below that, so pmbootstrap is installed from git rather than pip.
#    Branch 2.3.x looks like the obvious choice and is wrong: its
#    apk_tools_min_version table stops at v3.20, and this fork's channel v24.12
#    is Alpine 3.21, so build dies with KeyError: 'v3.21'. 3.4.x is the first
#    branch that has the entry. 3.4.x also needs the tomli backport on the
#    runner's Python 3.10, which pip does not pull in by itself.
#  - the device's deviceinfo has no deviceinfo_kernel_flavor, so the default
#    would be "mainline" and pmbootstrap would look for a kernel package that
#    does not exist. The fork ships linux-postmarketos-qcom-sm7150, so the
#    kernel is set to qcom-sm7150 to match.
#  - ask_for_channel() runs git show <remote>/master:channels.cfg with the
#    remote found by substring-matching clone remotes against the official
#    pmaports URL, and 3.4.x has no --config-channels flag to bypass it. So
#    the lookup is made to resolve: the official URL is registered as the push
#    URL (fetch keeps using the fork) and the fork's master is fetched into
#    refs/remotes/origin/master. Nothing checked out changes.
#  - everything runs as root with --as-root. The earlier two-user layout
#    (runner drives, pmuser builds) died the moment a chroot directory created
#    by root met a marker file written by pmuser: Errno 13 on
#    chroot_native/tmp/pmb_chroot_abuild_init_done. One user, no split.

on:
  workflow_dispatch:
    inputs:
      pmaports_branch:
        description: 'Branch of the courbet fork'
        required: false
        default: 'courbet_stable'
      pmbootstrap_branch:
        description: 'pmbootstrap branch (3.4.x is the first that knows v3.21)'
        required: false
        default: '3.4.x'
      device:
        description: 'pmOS device codename'
        required: false
        default: 'xiaomi-courbet'
      kernel_pkg:
        description: 'kernel package to build'
        required: false
        default: 'linux-postmarketos-qcom-sm7150'
      cmdline:
        description: 'kernel cmdline (deviceinfo says console=null, so blank)'
        required: false
        default: ''

env:
  BUILD_DIR: /root/pmbuild
  PMAPORTS_REPO: https://gitlab.postmarketos.org/kevinwidjaja21/pmaports
  PMB_REPO: https://gitlab.postmarketos.org/postmarketOS/pmbootstrap
  PMB_CFG: /root/.config/pmbootstrap.cfg

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Install host dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates file cpio patch binutils \
            python3 python3-venv python3-pip \
            build-essential bc bison flex gawk libssl-dev libncurses-dev \
            util-linux squashfs-tools lz4 zstd xz-utils \
            qemu-user-static \
            gcc-aarch64-linux-gnu
          mkdir -p out

      - name: Install pmbootstrap from git
        run: |
          set -e
          sudo python3 -m venv /opt/pmb
          git clone --depth 1 -b "${{ github.event.inputs.pmbootstrap_branch }}" \
                    "$PMB_REPO" /opt/pmb-src
          sudo /opt/pmb/bin/pip install --no-cache-dir /opt/pmb-src
          sudo ln -sf /opt/pmb/bin/pmbootstrap /usr/local/bin/pmbootstrap
          # 3.4.x imports tomllib (Python 3.11+) with a tomli fallback, but the
          # runner is Python 3.10 and pip did not pull the backport in, so the
          # import chain dies here instead of inside pmbootstrap later.
          sudo /opt/pmb/bin/pip install --no-cache-dir tomli
          /opt/pmb/bin/python - <<'PY'
          import pmb
          v = tuple(int(x) for x in pmb.__version__.split(".")[:3])
          print("pmbootstrap", pmb.__version__)
          assert v >= (2, 3, 2), "fork requires >= 2.3.2, got %s" % pmb.__version__
          PY

      - name: Clone the courbet fork of pmaports
        run: |
          set -e
          sudo mkdir -p "$BUILD_DIR"
          sudo -H git clone --depth 1 \
            -b "${{ github.event.inputs.pmaports_branch }}" \
            "$PMAPORTS_REPO" "$BUILD_DIR/pmaports"

          # ask_for_channel() runs
          #   git show <official-remote>/master:channels.cfg
          # where the remote is found by substring-matching the clone's remotes
          # against the official pmaports URL. The 3.4.x tree has no
          # --config-channels flag at all, so the lookup itself must resolve.
          # Two moves make it resolve without touching what is checked out:
          # the official URL is registered as the push URL (fetch keeps using
          # the fork), and the fork's master branch is fetched into the
          # refs/remotes/origin/master ref the command reads.
          sudo -H bash -c "
            set -e
            cd '$BUILD_DIR/pmaports'
            git remote set-url --push origin https://gitlab.postmarketos.org/postmarketOS/pmaports.git
            git fetch -q --depth 1 origin master
            git update-ref refs/remotes/origin/master FETCH_HEAD
            git show origin/master:channels.cfg | head -5
            echo \"branch : \$(git rev-parse --abbrev-ref HEAD) \$(git rev-parse --short HEAD)\"
            echo '--- port and kernel aport ---'
            ls -d device/*/device-xiaomi-courbet
            ls -d device/*/linux-postmarketos-qcom-sm7150
            echo '--- pmaports.cfg ---'
            grep -E 'version|channel' pmaports.cfg
            echo '--- deviceinfo ---'
            grep -E 'deviceinfo_(dtb|append_dtb|flash_method|kernel_cmdline|header_version|flash_offset|flash_pagesize)' \
              device/*/device-xiaomi-courbet/deviceinfo
          "

      - name: Write pmbootstrap config
        run: |
          set -e
          sudo mkdir -p /root/.config
          sudo tee "$PMB_CFG" > /dev/null <<EOF
          [pmbootstrap]
          aports = $BUILD_DIR/pmaports
          device = ${{ github.event.inputs.device }}
          kernel = qcom-sm7150
          work = $BUILD_DIR/work
          is_default_channel = False
          user = pm
          ui = none
          extra_packages = none
          locale = en_US.UTF-8
          timezone = GMT
          hostname = courbet
          ccache_size = 0
          EOF
          sudo chmod 600 "$PMB_CFG"

      - name: pmbootstrap init
        run: |
          # `yes` dies with SIGPIPE once pmbootstrap stops reading stdin, which
          # it does as soon as init finishes. That must not fail the step, so
          # errexit is off around the pipeline and the real exit status comes
          # from PIPESTATUS.
          set +e
          yes '' | sudo -H pmbootstrap --details-to-stdout -y --as-root \
                     -c "$PMB_CFG" \
                     -w "$BUILD_DIR/work" init 2>&1 | tee out/init.log
          rc=${PIPESTATUS[1]}
          set -e
          echo "pmbootstrap init exit: $rc"
          echo "--- config as it ended up ---"
          sudo cat "$PMB_CFG" || true
          test "$rc" -eq 0

      - name: Build kernel package
        run: |
          set +e
          sudo -H pmbootstrap --details-to-stdout -y --as-root \
                   -c "$PMB_CFG" \
                   -w "$BUILD_DIR/work" build '${{ github.event.inputs.kernel_pkg }}' --force \
            2>&1 | tee out/kernel.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "pmbootstrap build exit: $rc"
          test "$rc" -eq 0

      - name: Install into chroot
        run: |
          set +e
          yes '' | sudo -H pmbootstrap --details-to-stdout -y --as-root \
                     -c "$PMB_CFG" \
                     -w "$BUILD_DIR/work" install --no-fde 2>&1 | tee out/install.log
          rc=${PIPESTATUS[1]}
          set -e
          echo "pmbootstrap install exit: $rc"
          test "$rc" -eq 0

      - name: Collect kernel, initramfs, dtb
        run: |
          set -e
          ROOT="$(sudo find "$BUILD_DIR/work" -maxdepth 1 -name 'chroot_rootfs_*' | head -1)"
          echo "chroot: $ROOT"
          sudo ls -la "$ROOT/boot"
          sudo cp "$ROOT"/boot/vmlinuz* out/vmlinuz
          sudo cp "$ROOT"/boot/initramfs* out/initramfs
          DTB="$(sudo find "$ROOT/boot" -name '*courbet*.dtb' | head -1 || true)"
          if [ -z "$DTB" ]; then
            echo "::error::no courbet dtb under $ROOT/boot; what is there:"
            sudo find "$ROOT/boot" -name '*.dtb' | head -20 || true
            exit 1
          fi
          echo "dtb: $DTB"
          sudo cp "$DTB" out/courbet.dtb
          sudo chown runner:runner out/*
          ls -la out

      - name: Package fastboot-bootable image
        run: |
          set -e
          python3 - <<'PY'
          import struct
          k = open("out/vmlinuz", "rb").read()
          r = open("out/initramfs", "rb").read()
          t = open("out/courbet.dtb", "rb").read()
          page = 4096
          n = lambda s: (s + page - 1) // page
          h = bytearray(page)
          h[0:8] = b"ANDROID!"
          # From device-xiaomi-courbet/deviceinfo: base 0, kernel 0x8000,
          # ramdisk 0x1000000, tags 0x100, page 4096.
          struct.pack_into("<10I", h, 8,
                           len(k), 0x8000, len(r), 0x1000000, 0, 0, 0x100, page, 0, 0)
          cmd = "${{ github.event.inputs.cmdline }}".encode()
          assert len(cmd) < 512
          h[64:64 + len(cmd)] = cmd
          img = bytearray(bytes(h) + k + b"\0" * (n(len(k)) * page - len(k)))
          img += r + b"\0" * (n(len(r)) * page - len(r)) + t
          # deviceinfo_append_dtb="true": tree length goes at offset 1648.
          struct.pack_into("<I", img, 1648, len(t))
          open("out/boot-pmos-courbet.img", "wb").write(img)
          print("kernel %d  ramdisk %d  dtb %d  image %d" % (len(k), len(r), len(t), len(img)))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-courbet-stable
          path: out/
          if-no-files-found: error
          retention-days: 30