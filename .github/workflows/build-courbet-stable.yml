name: Build pmOS for courbet (courbet_stable fork)

# The working pmOS path for courbet is an out-of-tree fork documented on the
# pmOS wiki: kevinwidjaja21/pmaports, branch courbet_stable, channel v24.12.
#
# Three obstacles, each confirmed by reading the code rather than by guessing:
#
#  1. gitlab.postmarketos.org is behind Anubis, a JavaScript anti-bot gate, so a
#     runner cannot clone pmaports from it. The branch tarball is downloaded
#     from a release asset instead, and checked for the gzip magic so an Anubis
#     page fails loudly instead of silently.
#
#  2. pmbootstrap lives on SourceHut and its latest PyPI release is still 2.1.0,
#     while the fork's pmaports.cfg declares pmbootstrap_min_version=2.3.2.
#     read_config() raises on that mismatch, so init dies before it starts.
#     It must be installed from git.sr.ht/~postmarketos/pmbootstrap master.
#
#  3. `pmbootstrap init` runs `git rev-parse` on the aports directory
#     unconditionally, so a plain unpacked tarball is not enough - it has to be
#     a git repository. It is made one here, on a branch that is not "master"
#     so the githooks copy step is skipped.
#
# The channel needs no branch switch: the fork's pmaports.cfg already says
# channel=v24.12, and is_default_channel=False keeps the prompt on that value,
# so switch_to_channel_branch() returns before touching git.
#
# Browser URL for the tarball:
#   https://gitlab.postmarketos.org/kevinwidjaja21/pmaports/-/archive/courbet_stable/pmaports-courbet_stable.tar.gz

on:
  workflow_dispatch:
    inputs:
      pmaports_tarball:
        description: 'Asset URL of the courbet_stable pmaports tarball'
        required: true
      device:
        description: 'pmOS device codename'
        required: false
        default: 'xiaomi-courbet'
      kernel_pkg:
        description: 'kernel package to build'
        required: false
        default: 'linux-postmarketos-qcom-sm7150'
      cmdline:
        description: 'kernel cmdline (deviceinfo says console=null, so blank)'
        required: false
        default: ''

env:
  BUILD_DIR: /home/pmuser/pmbuild
  PMB_REPO: https://git.sr.ht/~postmarketos/pmbootstrap

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Install host dependencies
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git curl ca-certificates file cpio patch binutils \
            python3 python3-venv python3-pip \
            build-essential bc bison flex gawk libssl-dev libncurses-dev \
            util-linux squashfs-tools lz4 zstd xz-utils \
            gcc-aarch64-linux-gnu
          mkdir -p out

      - name: Install pmbootstrap from SourceHut
        run: |
          set -e
          sudo apt-get install -y --no-install-recommends python3-venv
          sudo python3 -m venv /opt/pmb
          git clone --depth 1 "$PMB_REPO" /opt/pmb-src
          sudo /opt/pmb/bin/pip install --no-cache-dir /opt/pmb-src
          sudo ln -sf /opt/pmb/bin/pmbootstrap /usr/local/bin/pmbootstrap
          # The fork refuses to initialise against anything older than 2.3.2,
          # and PyPI has never gone past 2.1.0, so print the version and fail
          # here rather than inside pmbootstrap with a vaguer message.
          /opt/pmb/bin/python - <<'PY'
          import pmb
          v = tuple(int(x) for x in pmb.__version__.split(".")[:3])
          print("pmbootstrap", pmb.__version__)
          assert v >= (2, 3, 2), "fork needs >= 2.3.2, got %s" % (pmb.__version__,)
          PY

      - name: Create build user
        run: |
          set -e
          sudo adduser --disabled-password --gecos "" pmuser
          echo "pmuser ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/pmuser
          sudo install -d -o pmuser -g pmuser -m 0755 "$BUILD_DIR"

      - name: Fetch pmaports tarball and make it a git checkout
        env:
          ASSET_URL: ${{ github.event.inputs.pmaports_tarball }}
        run: |
          set -e
          curl -Lf -H "Authorization: Bearer $GITHUB_TOKEN" \
               -o /tmp/pmaports.tar.gz "$ASSET_URL"
          if [ "$(od -An -tx1 -N2 /tmp/pmaports.tar.gz | tr -d ' ')" != "1f8b" ]; then
            echo "::error::that URL did not return a gzip tarball."
            echo "Most likely the Anubis challenge page came back instead."
            head -c 300 /tmp/pmaports.tar.gz || true
            exit 1
          fi
          sudo -u pmuser -H tar -xzf /tmp/pmaports.tar.gz -C "$BUILD_DIR"
          sudo -u pmuser -H bash -c "mv '$BUILD_DIR'/pmaports-* '$BUILD_DIR/pmaports'"
          # pmbootstrap init runs git rev-parse on this directory without
          # checking whether it is a repository first.
          sudo -u pmuser -H bash -c "
            cd '$BUILD_DIR/pmaports' &&
            git init -q -b courbet_stable &&
            git -c user.email=ci@localhost -c user.name=ci add -A &&
            git -c user.email=ci@localhost -c user.name=ci commit -q -m fork &&
            git rev-parse --abbrev-ref HEAD"

          echo "--- port and kernel aport ---"
          ls -d "$BUILD_DIR"/pmaports/device/*/device-xiaomi-courbet
          ls -d "$BUILD_DIR"/pmaports/device/*/linux-postmarketos-qcom-sm7150
          echo "--- pmaports.cfg ---"
          cat "$BUILD_DIR/pmaports/pmaports.cfg"
          echo "--- deviceinfo ---"
          grep -E 'deviceinfo_(dtb|append_dtb|flash_method|kernel_cmdline|header_version|flash_offset|flash_pagesize)' \
            "$BUILD_DIR"/pmaports/device/*/device-xiaomi-courbet/deviceinfo

      - name: Write pmbootstrap config
        run: |
          set -e
          sudo mkdir -p /home/pmuser/.config
          sudo tee /home/pmuser/.config/pmbootstrap.cfg > /dev/null <<EOF
          [pmbootstrap]
          aports = $BUILD_DIR/pmaports
          device = ${{ github.event.inputs.device }}
          kernel = qcom-sm7150
          work = $BUILD_DIR/work
          is_default_channel = False
          user = pm
          ui = none
          extra_packages = none
          locale = en_US.UTF-8
          timezone = GMT
          hostname = courbet
          ccache_size = 0
          EOF
          sudo chown pmuser:pmuser /home/pmuser/.config/pmbootstrap.cfg
          sudo chmod 600 /home/pmuser/.config/pmbootstrap.cfg

      - name: pmbootstrap init
        run: |
          set -o pipefail
          yes '' | sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' init" 2>&1 | tee out/init.log
          rc=${PIPESTATUS[1]}
          echo "init exit: $rc"
          echo "--- config as it ended up ---"
          sudo -u pmuser -H env HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            cat /home/pmuser/.config/pmbootstrap.cfg || true
          test "$rc" -eq 0

      - name: Build kernel package
        run: |
          set -o pipefail
          sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' build '${{ github.event.inputs.kernel_pkg }}' --force" \
            2>&1 | tee out/kernel.log
          test "${PIPESTATUS[1]}" -eq 0

      - name: Install into chroot
        run: |
          set -o pipefail
          yes '' | sudo -u pmuser -H env \
            HOME=/home/pmuser \
            XDG_CONFIG_HOME=/home/pmuser/.config \
            bash -c "cd '$BUILD_DIR' && pmbootstrap --details-to-stdout -y \
                     -c /home/pmuser/.config/pmbootstrap.cfg \
                     -w '$BUILD_DIR/work' install --no-fde" 2>&1 | tee out/install.log
          test "${PIPESTATUS[1]}" -eq 0

      - name: Collect kernel, initramfs, dtb
        run: |
          set -e
          ROOT="$(sudo find "$BUILD_DIR/work" -maxdepth 1 -name 'chroot_rootfs_*' | head -1)"
          echo "chroot: $ROOT"
          sudo ls -la "$ROOT/boot"
          sudo cp "$ROOT"/boot/vmlinuz* out/vmlinuz
          sudo cp "$ROOT"/boot/initramfs* out/initramfs
          DTB="$(sudo find "$ROOT/boot" -name '*courbet*.dtb' | head -1 || true)"
          if [ -z "$DTB" ]; then
            echo "::error::no courbet dtb under $ROOT/boot; what is there:"
            sudo find "$ROOT/boot" -name '*.dtb' | head -20 || true
            exit 1
          fi
          echo "dtb: $DTB"
          sudo cp "$DTB" out/courbet.dtb
          sudo chown runner:runner out/*
          ls -la out

      - name: Package fastboot-bootable image
        run: |
          set -e
          python3 - <<'PY'
          import struct
          k = open("out/vmlinuz", "rb").read()
          r = open("out/initramfs", "rb").read()
          t = open("out/courbet.dtb", "rb").read()
          page = 4096
          n = lambda s: (s + page - 1) // page
          h = bytearray(page)
          h[0:8] = b"ANDROID!"
          # From device-xiaomi-courbet/deviceinfo: base 0, kernel 0x8000,
          # ramdisk 0x1000000, tags 0x100, page 4096.
          struct.pack_into("<10I", h, 8,
                           len(k), 0x8000, len(r), 0x1000000, 0, 0, 0x100, page, 0, 0)
          cmd = "${{ github.event.inputs.cmdline }}".encode()
          assert len(cmd) < 512
          h[64:64 + len(cmd)] = cmd
          img = bytearray(bytes(h) + k + b"\0" * (n(len(k)) * page - len(k)))
          img += r + b"\0" * (n(len(r)) * page - len(r)) + t
          # deviceinfo_append_dtb="true": tree length goes at offset 1648.
          struct.pack_into("<I", img, 1648, len(t))
          open("out/boot-pmos-courbet.img", "wb").write(img)
          print("kernel %d  ramdisk %d  dtb %d  image %d" % (len(k), len(r), len(t), len(img)))
          PY

      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-courbet-stable
          path: out/
          if-no-files-found: error
          retention-days: 30