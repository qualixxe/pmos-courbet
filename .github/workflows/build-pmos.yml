name: Build postmarketOS payload for courbet

# Why CI: pmbootstrap needs a real Linux to build chroots, and this host has
# neither WSL nor usable virtualization. A GitHub runner already is one.
#
# Why not gitlab.postmarketos.org: it is behind Anubis, a proof-of-work
# anti-scraping gate that requires JavaScript. Automated clients get the
# challenge page instead of a git stream, and the clone fails. This is why the
# first run of this workflow died on step 5 - not a missing dependency.
#
# Both problems are dodged:
#   pmbootstrap  -> PyPI (2.1.0), installed with pip
#   pmaports     -> github.com/sm7150-mainline/pmaports, branch "generic",
#                   which carries the SM7150 mainline port
#
# Why a boot.img: the firmware in edk2-sm7150 exposes only USB Mass Storage with
# FAT32. No UFS driver (Qualcomm UFS is not on PCI) and the network stack is
# compiled out, so nothing can be read from storage. `fastboot boot` pushes an
# image into RAM over USB and starts it without writing a partition - the only
# delivery path that needs no USB-C OTG adapter.

on:
  push:
    branches: [main]
    paths:
      - 'device/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
    inputs:
      device:
        description: 'postmarketOS device port to build'
        required: false
        default: 'xiaomi-surya'
      flavor:
        description: 'kernel flavour'
        required: false
        default: 'mainline'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PMS_APK_REPO: https://github.com/sm7150-mainline/pmaports
  PMS_APK_BRANCH: generic

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: dev
        run: |
          set -e
          DEVICE="${{ github.event.inputs.device }}"
          FLAVOR="${{ github.event.inputs.flavor }}"
          [ -n "$DEVICE" ] || DEVICE=xiaomi-surya
          [ -n "$FLAVOR" ] || FLAVOR=mainline
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR"  >> "$GITHUB_OUTPUT"
          echo "target: $DEVICE ($FLAVOR)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cpio curl binutils file patch \
            python3 python3-dev python3-pip python3-setuptools python3-virtualenv \
            build-essential \
            gcc-aarch64-linux-gnu \
            bc bison flex gawk \
            libssl-dev libncurses-dev \
            util-linux squashfs-tools lz4 zstd xz-utils

      - name: Install pmbootstrap
        # Invoke through bash rather than as ./script: Git for Windows does not
        # record the executable bit, so the file arrives without +x and the
        # direct invocation dies with exit 126, "Permission denied".
        run: bash ./scripts/install-pmbootstrap.sh

      - name: Fetch pmaports mirror
        run: |
          set -e
          git clone --depth 1 -b "$PMS_APK_BRANCH" "$PMS_APK_REPO" pmaports
          echo "device ports in mirror: $(ls pmaports/device/*/ -d 2>/dev/null | wc -l)"
          echo
          echo "SM7150-related packages:"
          ls pmaports/device/community/ | grep -Ei 'sm7150|surya' || true
          ls pmaports/device/community/ | grep -Ei 'courbet' || echo "  (no courbet port)"

      - name: Create build user
        run: |
          set -e
          sudo adduser --disabled-password --gecos "" pmuser
          echo "pmuser ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/pmuser
          sudo chmod 700 /home/pmuser
          # The build runs as pmuser but the work dir lives in the workspace,
          # which is owned by `runner`. Without this pmbootstrap cannot create
          # it, and the packaging step then finds no output at all.
          sudo chmod -R a+rwX "$GITHUB_WORKSPACE"
          echo "workspace writable by: $(stat -c '%A %U' "$GITHUB_WORKSPACE")"

      - name: Report maturity of the target
        run: |
          set +e
          D="${{ steps.dev.outputs.device }}"
          echo "### Device support reality check"
          echo
          INFO="pmaports/device/community/device-$D/deviceinfo"
          if [ -f "$INFO" ]; then
            echo "\`device-$D\` exists in the mirror:"
            echo '```'
            grep -E 'device_type|codename|screen_width|screen_height|dtb|getty|flash_method' "$INFO"
            echo '```'
          else
            echo "device-$D not found in the mirror."
          fi
          echo
          if grep -q 'device_type *= *"ref"' pmaports/device/community/device-qcom-sm7150/deviceinfo 2>/dev/null; then
            echo "> **The SM7150 SoC port is marked \`device_type=\"ref\"\`,** which in"
            echo "> postmarketOS means a reference configuration kept for CI tests, not a"
            echo "> device someone has verified boots. Expect the kernel to reach userspace"
            echo "> without a working panel; there is no display to read, and the console is"
            echo "> UART (\`getty=ttyMSM0\`), which needs a USB-TTL adapter to see."
          fi
          {
            echo
            echo "### Known limitation"
            echo
            echo "- No \`courbet\` port exists. \`xiaomi-surya\` is the closest: same SM7150"
            echo "  family, and the same 1080x2400 panel."
            echo "- The SM7150 base port is a reference config for CI, so mainline display"
            echo "  support is unproven on real hardware."
            echo "- Console is UART only; the firmware exposes no USB, so a failed boot"
            echo "  produces no visible output."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: pmbootstrap init
        run: |
          sudo -iu pmuser bash -lc "
            set -eu
            cd '$GITHUB_WORKSPACE'
            pmbootstrap init \
              --work-dir work \
              --apkrepo '$PMS_APK_REPO' \
              --branch '$PMS_APK_BRANCH' \
              '${{ steps.dev.outputs.device }}' \
              --kernel-flavor '${{ steps.dev.outputs.flavor }}'
          "

      - name: pmbootstrap build
        run: |
          sudo -iu pmuser bash -lc "
            set -eu
            cd '$GITHUB_WORKSPACE'
            pmbootstrap build --work-dir work
            echo '=== work dir after build ==='
            ls -la work || echo 'work dir is missing'
          "

      - name: Locate build output
        run: |
          set -e
          # Report what actually exists before anything depends on it, so the
          # next failure is never another mystery.
          echo "=== top of work dir ==="
          ls -la work 2>/dev/null || echo "  work dir is absent"
          echo
          echo "=== kernel / initramfs candidates ==="
          find work -maxdepth 8 \( -name 'vmlinuz*' -o -name 'initramfs*' -o -name '*.img' \) \
            -type f -printf '%10s  %p\n' 2>/dev/null | head -30 || true

      - name: Package fastboot-bootable image
        run: |
          set -e
          KERNEL=$(find work -name 'vmlinuz*' -type f | head -1)
          RAMDISK=$(find work -name 'initramfs*' -type f | head -1)

          if [ -z "$KERNEL" ] || [ -z "$RAMDISK" ]; then
            echo "::error::no kernel or initramfs produced; see the Locate step above"
            exit 1
          fi
          echo "kernel : $KERNEL ($(stat -c%s "$KERNEL") bytes)"
          echo "ramdisk: $RAMDISK ($(stat -c%s "$RAMDISK") bytes)"

          # Use courbet's own device tree when it is present. A mainline kernel
          # cannot take the Android tree directly, so this only becomes useful
          # once a mainline-format courbet tree exists; until then the port's
          # own tree is the right default.
          DTB_ARGS=()
          if [ -f device/courbet.dtb ]; then
            DTB_ARGS=(--dtb device/courbet.dtb)
            echo "dtb    : device/courbet.dtb"
          else
            echo "dtb    : none - payload relies on the kernel's built-in tree"
          fi

          mkdir -p out
          python3 scripts/mkbootimg.py --kernel "$KERNEL" --ramdisk "$RAMDISK" \
                   "${DTB_ARGS[@]}" -o out/boot-pmos.img
          python3 scripts/mkbootimg.py --kernel "$KERNEL" --ramdisk "$RAMDISK" \
                   "${DTB_ARGS[@]}" --pad-to-partition -o out/boot-pmos-128m.img
          echo
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pmos-${{ steps.dev.outputs.device }}-${{ steps.dev.outputs.flavor }}
          path: out/
          if-no-files-found: error
          retention-days: 30
