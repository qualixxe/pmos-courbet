name: Build postmarketOS payload for courbet

# Why CI: pmbootstrap needs a real Linux to build chroots, and this host has
# neither WSL nor usable virtualization. A GitHub runner already is one.
#
# Why not gitlab.postmarketos.org: it is behind Anubis, a proof-of-work
# anti-scraping gate that needs JavaScript. Automated clients get the challenge
# page instead of a git stream and the clone fails.
#
# Why a boot.img: the firmware in edk2-sm7150 exposes only USB Mass Storage with
# FAT32. No UFS driver - Qualcomm UFS is not on PCI - and the network stack is
# compiled out, so nothing can be read from storage. `fastboot boot` pushes an
# image into RAM over USB and starts it without writing a partition, which is
# the only delivery path that needs no USB-C OTG adapter.

on:
  push:
    branches: [main]
    paths:
      - 'device/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:
    inputs:
      device:
        description: 'postmarketOS device port to build'
        required: false
        default: 'xiaomi-surya'
      flavor:
        description: 'kernel flavour'
        required: false
        default: 'mainline'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PMS_APK_REPO: https://github.com/sm7150-mainline/pmaports
  PMS_APK_BRANCH: generic
  BUILD_DIR: /home/pmuser/pmbuild

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: dev
        run: |
          set -e
          DEVICE="${{ github.event.inputs.device }}"
          FLAVOR="${{ github.event.inputs.flavor }}"
          [ -n "$DEVICE" ] || DEVICE=xiaomi-surya
          [ -n "$FLAVOR" ] || FLAVOR=mainline
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "flavor=$FLAVOR"  >> "$GITHUB_OUTPUT"
          echo "target: $DEVICE ($FLAVOR)"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git cpio curl binutils file patch \
            python3 python3-dev python3-pip python3-setuptools python3-venv \
            build-essential \
            gcc-aarch64-linux-gnu \
            bc bison flex gawk \
            libssl-dev libncurses-dev \
            util-linux squashfs-tools lz4 zstd xz-utils

      - name: Install pmbootstrap
        # Invoke through bash: Git for Windows does not record the executable
        # bit, so a direct ./ invocation dies with exit 126.
        run: bash ./scripts/install-pmbootstrap.sh

      - name: Create build user
        run: |
          set -e
          sudo adduser --disabled-password --gecos "" pmuser
          echo "pmuser ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/pmuser
          sudo chmod 700 /home/pmuser

      - name: Prepare the build directory
        run: |
          set -e
          # The build cannot run in the workspace. The workspace itself is
          # 0777, but /home/runner above it is 0700, so a different user cannot
          # traverse into it no matter what the workspace's own mode says.
          # chmod'ing the workspace does not help, and the failure showed up as
          # "cd: Permission denied" with pmbootstrap then exiting silently.
          #
          # So the build lives in the build user's own home, and results are
          # copied back afterwards.
          sudo install -d -o pmuser -g pmuser -m 0755 "$BUILD_DIR"
          sudo -u pmuser -H bash -c "cd '$BUILD_DIR' && pwd && touch .w && rm .w && echo writable"
          echo "build dir: $BUILD_DIR"

      - name: Fetch pmaports mirror
        run: |
          set -e
          git clone --depth 1 -b "$PMS_APK_BRANCH" "$PMS_APK_REPO" pmaports
          echo "device port categories: $(ls -d pmaports/device/*/ | wc -l)"
          echo
          echo "SM7150-related packages:"
          ls pmaports/device/community/ | grep -Ei 'sm7150|surya' || echo "  (none)"
          ls pmaports/device/community/ | grep -Ei 'courbet' || echo "  (no courbet port)"

      - name: Report maturity of the target
        run: |
          set +e
          D="${{ steps.dev.outputs.device }}"
          echo "### Device support reality check"
          echo
          INFO="pmaports/device/community/device-$D/deviceinfo"
          if [ -f "$INFO" ]; then
            echo "\`device-$D\` exists in the mirror:"
            echo '```'
            grep -E 'device_type|codename|screen_width|screen_height|dtb|getty|flash_method' "$INFO"
            echo '```'
          else
            echo "device-$D not found in the mirror."
          fi
          echo
          if grep -q 'device_type *= *"ref"' pmaports/device/community/device-qcom-sm7150/deviceinfo 2>/dev/null; then
            echo '> **The SM7150 SoC port is `device_type="ref"`,** which in postmarketOS'
            echo '> means a reference configuration kept for CI tests, not a device'
            echo '> someone has verified boots. Expect the kernel to reach userspace'
            echo '> without a working panel.'
          fi
          {
            echo
            echo "### Known limitations"
            echo
            echo "- No \`courbet\` port exists. \`xiaomi-surya\` is the closest: same SM7150"
            echo "  family, and the same 1080x2400 panel."
            echo "- The SM7150 base port is a CI reference config, so mainline display"
            echo "  support is unproven on real hardware."
            echo "- Console is UART (\`getty=ttyMSM0\`) and the firmware exposes no USB, so a"
            echo "  failed boot gives no visible output and no log."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: pmbootstrap init
        run: |
          set -o pipefail
          sudo -u pmuser -H bash -c "
            cd '$BUILD_DIR' || exit 1
            pmbootstrap init \
              --work-dir '$BUILD_DIR/work' \
              --apkrepo '$PMS_APK_REPO' \
              --branch '$PMS_APK_BRANCH' \
              '${{ steps.dev.outputs.device }}' \
              --kernel-flavor '${{ steps.dev.outputs.flavor }}'
          " 2>&1 | tee "$RUNNER_TEMP/init.log"
          echo "exit: ${PIPESTATUS[0]}"

      - name: pmbootstrap build
        run: |
          set -o pipefail
          sudo -u pmuser -H bash -c "
            cd '$BUILD_DIR' || exit 1
            pmbootstrap build --work-dir '$BUILD_DIR/work'
          " 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "exit: ${PIPESTATUS[0]}"

      - name: Locate and copy build output
        run: |
          set -e
          echo "=== kernel / initramfs produced ==="
          sudo find "$BUILD_DIR/work" \
            \( -name 'vmlinuz*' -o -name 'initramfs*' \) -type f \
            -printf '%10s  %p\n' 2>/dev/null | tee "$RUNNER_TEMP/outputs.txt" | head -20

          KERNEL=$(sudo find "$BUILD_DIR/work" -name 'vmlinuz*' -type f | head -1)
          RAMDISK=$(sudo find "$BUILD_DIR/work" -name 'initramfs*' -type f | head -1)

          if [ -z "$KERNEL" ] || [ -z "$RAMDISK" ]; then
            echo "::error::no kernel or initramfs was produced"
            echo "--- work dir ---"
            sudo ls -la "$BUILD_DIR/work" 2>/dev/null | head -20 || echo "  absent"
            echo "--- tail of build.log ---"
            tail -30 "$RUNNER_TEMP/build.log" || true
            exit 1
          fi

          mkdir -p artifacts
          sudo cp "$KERNEL"  artifacts/vmlinuz
          sudo cp "$RAMDISK" artifacts/initramfs
          sudo chown runner:runner artifacts/*
          echo
          ls -la artifacts

      - name: Package fastboot-bootable image
        run: |
          set -e
          KERNEL=artifacts/vmlinuz
          RAMDISK=artifacts/initramfs
          echo "kernel : $(stat -c%s "$KERNEL") bytes"
          echo "ramdisk: $(stat -c%s "$RAMDISK") bytes"

          # courbet's own tree would be the right thing, but a mainline kernel
          # cannot consume the Android tree, so only use it if a mainline-format
          # one has been added here. Otherwise rely on the kernel's built-in tree.
          DTB_ARGS=()
          if [ -f device/courbet.dtb ]; then
            DTB_ARGS=(--dtb device/courbet.dtb)
            echo "dtb    : device/courbet.dtb"
          else
            echo "dtb    : none - payload relies on the kernel's built-in tree"
          fi

          mkdir -p out
          python3 scripts/mkbootimg.py --kernel "$KERNEL" --ramdisk "$RAMDISK" \
                   "${DTB_ARGS[@]}" -o out/boot-pmos.img
          python3 scripts/mkbootimg.py --kernel "$KERNEL" --ramdisk "$RAMDISK" \
                   "${DTB_ARGS[@]}" --pad-to-partition -o out/boot-pmos-128m.img
          cp "$RUNNER_TEMP"/init.log "$RUNNER_TEMP"/build.log out/ 2>/dev/null || true
          echo
          ls -la out

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: pmos-${{ steps.dev.outputs.device }}-${{ steps.dev.outputs.flavor }}
          path: out/
          if-no-files-found: error
          retention-days: 30
